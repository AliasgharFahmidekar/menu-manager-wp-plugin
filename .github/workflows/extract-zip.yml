name: Extract Plugin ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "*.zip"
      - ".github/workflows/extract-zip.yml"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract plugin ZIP into repository
        shell: bash
        run: |
          set -euo pipefail

          zip_file="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"

          if [ -z "$zip_file" ]; then
            echo "No ZIP file found in repository root."
            exit 1
          fi

          rm -rf extracted
          mkdir -p extracted
          unzip -q "$zip_file" -d extracted

          # Copy the extracted files/folders into the repository root.
          # Keep the original ZIP and workflow intact.
          cp -a extracted/. .

          rm -rf extracted

          echo "Extracted: $zip_file"
          echo "Repository contents:"
          find . -maxdepth 4 -type f \
            ! -path './.git/*' \
            ! -name '*.zip' \
            | sort

      - name: Commit extracted files to main
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git reset -- '*.zip'

          if git diff --cached --quiet; then
            echo "No extracted file changes to commit."
            exit 0
          fi

          git commit -m "build: extract plugin files from zip"
          git push origin main
