name: Extract Plugin ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "*.zip"
      - ".github/workflows/extract-zip.yml"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract plugin ZIP at repository root
        shell: bash
        run: |
          set -euo pipefail

          zip_file="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"

          if [ -z "$zip_file" ]; then
            echo "No ZIP file found in repository root."
            exit 1
          fi

          # Start from a clean repository root, preserving only GitHub metadata and ZIP.
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name '*.zip' \
            -exec rm -rf {} +

          rm -rf extracted
          mkdir -p extracted
          unzip -q "$zip_file" -d extracted

          # If the ZIP contains one top-level plugin directory, flatten it.
          entries=(extracted/*)
          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
            plugin_root="${entries[0]}"
          else
            plugin_root="extracted"
          fi

          cp -a "${plugin_root}/." .

          rm -rf extracted

          echo "Extracted plugin from: $zip_file"
          echo "Top-level repository contents:"
          find . -mindepth 1 -maxdepth 2 \
            ! -path './.git*' \
            ! -path './.github*' \
            ! -name '*.zip' \
            -print | sort

      - name: Commit plugin files to main
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git reset -- '*.zip'

          if git diff --cached --quiet; then
            echo "No plugin file changes to commit."
            exit 0
          fi

          git commit -m "build: publish plugin files at repository root"
          git push origin main
